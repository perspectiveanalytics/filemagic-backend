name: "filemagic-poppler"

mode: ONCE

uidmap {
    inside_id: "65534"
    outside_id: ""
    count: 1
}
gidmap {
    inside_id: "65534"
    outside_id: ""
    count: 1
}

# Namespace isolation
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

# Resource limits (moderate for pdfimages)
rlimit_as: 768
rlimit_as_type: VALUE
rlimit_cpu: 60
rlimit_fsize: 128
rlimit_nofile: 64
rlimit_core: 0
rlimit_nproc: 32
rlimit_stack: 8
rlimit_msgqueue: 0
rlimit_memlock: 0
rlimit_rtprio: 0

time_limit: 60

# Security hardening
mount_proc: false
iface_no_lo: true
keep_env: false
keep_caps: false

# Anti-exploit personality flags
persona_addr_compat_layout: false
persona_mmap_page_zero: false
persona_read_implies_exec: false
persona_addr_limit_3gb: false
persona_addr_no_randomize: false

log_level: WARNING

cwd: "/tmp"

envar: "HOME=/tmp"
envar: "TMPDIR=/tmp"
envar: "PATH=/usr/bin"

# /bin → /usr/bin symlink
mount {
    src: "/bin"
    dst: "/bin"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}

# Read-only system mounts
mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    mandatory: true
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/usr/lib"
    dst: "/usr/lib"
    is_bind: true
    mandatory: true
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/usr/bin"
    dst: "/usr/bin"
    is_bind: true
    mandatory: true
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/etc/alternatives"
    dst: "/etc/alternatives"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}

# Poppler data files
mount {
    src: "/usr/share/poppler"
    dst: "/usr/share/poppler"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}

# Dynamic linker cache
mount {
    src: "/etc/ld.so.cache"
    dst: "/etc/ld.so.cache"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}

# Minimal /dev
mount {
    dst: "/dev"
    fstype: "tmpfs"
}
mount {
    src: "/dev/null"
    dst: "/dev/null"
    is_bind: true
    mandatory: true
}
mount {
    src: "/dev/urandom"
    dst: "/dev/urandom"
    is_bind: true
    mandatory: true
}

# Writable tmpfs for scratch
mount {
    dst: "/tmp"
    fstype: "tmpfs"
    rw: true
    noexec: true
    nodev: true
    nosuid: true
}
