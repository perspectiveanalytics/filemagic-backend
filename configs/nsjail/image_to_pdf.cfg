name: "filemagic-image-to-pdf"

mode: ONCE

uidmap {
    inside_id: "65534"
    outside_id: ""
    count: 1
}
gidmap {
    inside_id: "65534"
    outside_id: ""
    count: 1
}

# Namespace isolation
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

# Resource limits (generous for ImageMagick with multiple images)
rlimit_as: 768
rlimit_as_type: VALUE
rlimit_cpu: 120
rlimit_fsize: 128
rlimit_nofile: 64
rlimit_core: 0
rlimit_nproc: 32        # Prevent fork bombs
rlimit_stack: 8         # Stack size limit (8MB)
rlimit_msgqueue: 0      # No message queues
rlimit_memlock: 0       # No memory locking
rlimit_rtprio: 0        # No realtime priority

time_limit: 120

# Security hardening
mount_proc: false
iface_no_lo: true
keep_env: false
keep_caps: false

# Anti-exploit personality flags
persona_addr_compat_layout: false
persona_mmap_page_zero: false
persona_read_implies_exec: false
persona_addr_limit_3gb: false
persona_addr_no_randomize: false  # Keep ASLR enabled

log_level: WARNING

cwd: "/tmp"

# Minimal environment for ImageMagick
envar: "HOME=/tmp"
envar: "TMPDIR=/tmp"
envar: "PATH=/usr/bin"
envar: "MAGICK_TEMPORARY_PATH=/tmp"
envar: "MAGICK_CONFIGURE_PATH=/work/magick-config"

# /bin → /usr/bin symlink (needed for #!/bin/sh in shell wrappers)
mount {
    src: "/bin"
    dst: "/bin"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}

# Read-only system mounts (hardened)
mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    mandatory: true
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/usr/lib"
    dst: "/usr/lib"
    is_bind: true
    mandatory: true
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/usr/bin"
    dst: "/usr/bin"
    is_bind: true
    mandatory: true
    rw: false
    nosuid: true
    nodev: true
}
# Debian/Ubuntu alternatives symlinks (e.g. /usr/bin/convert → /etc/alternatives/...)
mount {
    src: "/etc/alternatives"
    dst: "/etc/alternatives"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
# ImageMagick config (v6 on Ubuntu, v7 on Arch) — system configs read-only
mount {
    src: "/etc/ImageMagick-6"
    dst: "/etc/ImageMagick-6"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/etc/ImageMagick-7"
    dst: "/etc/ImageMagick-7"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
# Hardened policy.xml — converter copies configs/nsjail/imagemagick-policy.xml
# to jobDir/magick-config/policy.xml which maps to /work/magick-config/ in jail.
# MAGICK_CONFIGURE_PATH tells ImageMagick to load policy.xml from this path first,
# overriding the system default. This disables delegates, restricts coders/paths,
# mitigating ImageTragick, CVE-2022-44268, CVE-2016-5118, etc.
# Only mount specific /usr/share subdirectories (minimise attack surface)
mount {
    src: "/usr/share/ImageMagick-6"
    dst: "/usr/share/ImageMagick-6"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/usr/share/ImageMagick-7"
    dst: "/usr/share/ImageMagick-7"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/usr/share/fonts"
    dst: "/usr/share/fonts"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
# Fonts for PDF rendering
mount {
    src: "/etc/fonts"
    dst: "/etc/fonts"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
# Dynamic linker cache
mount {
    src: "/etc/ld.so.cache"
    dst: "/etc/ld.so.cache"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}

# Minimal /dev
mount {
    dst: "/dev"
    fstype: "tmpfs"
}
mount {
    src: "/dev/null"
    dst: "/dev/null"
    is_bind: true
    mandatory: true
}
mount {
    src: "/dev/urandom"
    dst: "/dev/urandom"
    is_bind: true
    mandatory: true
}

# Writable tmpfs for scratch (hardened)
mount {
    dst: "/tmp"
    fstype: "tmpfs"
    rw: true
    noexec: true
    nodev: true
    nosuid: true
}
