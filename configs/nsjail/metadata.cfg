name: "filemagic-metadata"

mode: ONCE

uidmap {
    inside_id: "65534"
    outside_id: ""
    count: 1
}
gidmap {
    inside_id: "65534"
    outside_id: ""
    count: 1
}

# Namespace isolation
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

# Resource limits (lightweight — exiftool is a Perl script)
rlimit_as: 384
rlimit_as_type: VALUE
rlimit_cpu: 30
rlimit_fsize: 64
rlimit_nofile: 64
rlimit_core: 0
rlimit_nproc: 16
rlimit_stack: 8
rlimit_msgqueue: 0
rlimit_memlock: 0
rlimit_rtprio: 0

time_limit: 30

# Security hardening
mount_proc: false
iface_no_lo: true
keep_env: false
keep_caps: false

# Anti-exploit personality flags
persona_addr_compat_layout: false
persona_mmap_page_zero: false
persona_read_implies_exec: false
persona_addr_limit_3gb: false
persona_addr_no_randomize: false

log_level: WARNING

cwd: "/tmp"

envar: "HOME=/tmp"
envar: "TMPDIR=/tmp"
envar: "PATH=/usr/bin"

# /bin → /usr/bin symlink (needed for #!/bin/sh in shell wrappers)
mount {
    src: "/bin"
    dst: "/bin"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}

# Read-only system mounts (hardened)
mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    mandatory: true
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/usr/lib"
    dst: "/usr/lib"
    is_bind: true
    mandatory: true
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/usr/bin"
    dst: "/usr/bin"
    is_bind: true
    mandatory: true
    rw: false
    nosuid: true
    nodev: true
}
# Debian/Ubuntu alternatives symlinks
mount {
    src: "/etc/alternatives"
    dst: "/etc/alternatives"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}

# Perl libraries (Arch: /usr/share/perl5, Ubuntu: /usr/share/perl)
mount {
    src: "/usr/share/perl5"
    dst: "/usr/share/perl5"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/usr/share/perl"
    dst: "/usr/share/perl"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}

# Minimal /dev
mount {
    dst: "/dev"
    fstype: "tmpfs"
}
mount {
    src: "/dev/null"
    dst: "/dev/null"
    is_bind: true
    mandatory: true
}
mount {
    src: "/dev/urandom"
    dst: "/dev/urandom"
    is_bind: true
    mandatory: true
}

# Writable tmpfs for scratch (hardened)
mount {
    dst: "/tmp"
    fstype: "tmpfs"
    rw: true
    noexec: true
    nodev: true
    nosuid: true
}
