name: "filemagic-image"

mode: ONCE

uidmap {
    inside_id: "65534"
    outside_id: ""
    count: 1
}
gidmap {
    inside_id: "65534"
    outside_id: ""
    count: 1
}

# Namespace isolation
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
# clone_newcgroup disabled: causes intermittent thread deadlocks in
# libheif/libde265 HEIC decoder when interacting with cgroupv2 hierarchy.
clone_newcgroup: false

# Resource limits
rlimit_as: 512
rlimit_as_type: VALUE
rlimit_cpu: 120
rlimit_fsize: 64
rlimit_nofile: 64
rlimit_core: 0
rlimit_nproc: 32        # Prevent fork bombs
rlimit_stack: 8         # Stack size limit (8MB)
rlimit_msgqueue: 0      # No message queues
rlimit_memlock: 0       # No memory locking
rlimit_rtprio: 0        # No realtime priority

time_limit: 120

# Security hardening
mount_proc: false
iface_no_lo: true
keep_env: false
keep_caps: false

# Anti-exploit personality flags
persona_addr_compat_layout: false
persona_mmap_page_zero: false
persona_read_implies_exec: false
persona_addr_limit_3gb: false
persona_addr_no_randomize: false  # Keep ASLR enabled

log_level: WARNING

cwd: "/tmp"

# Minimal environment for sandboxed tools
envar: "HOME=/tmp"
envar: "TMPDIR=/tmp"
envar: "PATH=/usr/bin"
# Cap vips thread pool to nproc-1: at full CPU count, vips threads + libde265
# decoder threads deadlock under nsjail's PID namespace isolation.
envar: "VIPS_CONCURRENCY=3"
# VIPS_BLOCK_UNTRUSTED removed: it blocks magickload which vips needs for BMP.
# Security is ensured by: validator whitelist (JPEG/PNG/WebP/HEIC/BMP/TIFF only),
# nsjail sandbox, and hardened ImageMagick policy.xml (no delegates, no dangerous coders).
envar: "MAGICK_CONFIGURE_PATH=/work/magick-config"

# /bin → /usr/bin symlink (needed for #!/bin/sh in shell wrappers)
mount {
    src: "/bin"
    dst: "/bin"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}

# Read-only system mounts (hardened)
mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    mandatory: true
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/usr/lib"
    dst: "/usr/lib"
    is_bind: true
    mandatory: true
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/usr/bin"
    dst: "/usr/bin"
    is_bind: true
    mandatory: true
    rw: false
    nosuid: true
    nodev: true
}
# Debian/Ubuntu alternatives symlinks
mount {
    src: "/etc/alternatives"
    dst: "/etc/alternatives"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
# Only mount specific /usr/share subdirectories (minimise attack surface)
mount {
    src: "/usr/share/glib-2.0"
    dst: "/usr/share/glib-2.0"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
# ImageMagick config — needed for vips magickload fallback (BMP, etc.)
# System configs read-only; hardened policy.xml is loaded from /work/magick-config/
mount {
    src: "/etc/ImageMagick-6"
    dst: "/etc/ImageMagick-6"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/etc/ImageMagick-7"
    dst: "/etc/ImageMagick-7"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/usr/share/ImageMagick-6"
    dst: "/usr/share/ImageMagick-6"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}
mount {
    src: "/usr/share/ImageMagick-7"
    dst: "/usr/share/ImageMagick-7"
    is_bind: true
    mandatory: false
    rw: false
    nosuid: true
    nodev: true
}

# Minimal /dev
mount {
    dst: "/dev"
    fstype: "tmpfs"
}
mount {
    src: "/dev/null"
    dst: "/dev/null"
    is_bind: true
    mandatory: true
}
mount {
    src: "/dev/urandom"
    dst: "/dev/urandom"
    is_bind: true
    mandatory: true
}

# Writable tmpfs for scratch (hardened)
mount {
    dst: "/tmp"
    fstype: "tmpfs"
    rw: true
    noexec: true
    nodev: true
    nosuid: true
}
